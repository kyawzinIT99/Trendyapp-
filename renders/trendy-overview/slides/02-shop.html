<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="style.css" />
  <title>The shop</title>
  <style>
    .grid { display: grid; grid-template-columns: 520px 1fr; gap: 72px; margin-top: 54px; align-items: start; }
    .cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 22px; }
    .card { background: #f6f3ee; border-radius: 22px; overflow: hidden; }
    .card img { width: 100%; height: 280px; object-fit: cover; display: block; }
    .card div { padding: 18px 18px 22px; }
    .name { font-size: 26px; font-weight: 600; }
    .meta { margin-top: 8px; font-size: 20px; color: #57534e; }
    .price { margin-top: 10px; font-size: 24px; font-weight: 650; }
    h1 { font-size: 78px; margin-top: 18px; }
    .langs { display: flex; gap: 12px; margin-top: 28px; }
    .pill { border: 1.5px solid #1c1917; border-radius: 999px; padding: 10px 18px; font-size: 22px; font-weight: 600; }
    .pill.on { background: #1c1917; color: #f6f3ee; }
  </style>
</head>
<body>
  <div class="kicker">The app</div>
  <div class="grid">
    <div>
      <h1>Shop in English or Burmese.</h1>
      <div class="rule"></div>
      <p style="font-size: 28px; line-height: 1.4;" class="muted">Every price is in kyats. Delivery stays inside Myanmar.</p>
      <div class="langs">
        <span class="pill on">EN</span>
        <span class="pill my">မြန်</span>
      </div>
    </div>
    <div class="cards">
      <article class="card">
        <img src="../../../public/images/macbook-air-13.png" alt="" />
        <div>
          <div class="name">MacBook Air 13</div>
          <div class="meta">★ 4.8</div>
          <div class="price">Ks 5,290,000</div>
        </div>
      </article>
      <article class="card">
        <img src="../../../public/images/iphone-18.png" alt="" />
        <div>
          <div class="name">iPhone 18</div>
          <div class="meta">★ 4.9</div>
          <div class="price">Ks 4,250,000</div>
        </div>
      </article>
      <article class="card">
        <img src="../../../public/images/iphone-duo.png" alt="" />
        <div>
          <div class="name">iPhone Duo</div>
          <div class="meta">★ 4.8</div>
          <div class="price">Ks 6,400,000</div>
        </div>
      </article>
    </div>
  </div>
  <div class="foot"><span>CATALOG ON THE PHONE</span><span>02</span></div>
</body>
</html>
